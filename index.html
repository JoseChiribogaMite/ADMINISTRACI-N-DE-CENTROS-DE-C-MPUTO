const UNIT_LABELS = { 1: "Unidad 1", 2: "Unidad 2" };
const LETTERS = ["A", "B", "C", "D"];

let mode = "u1";            // u1 | u2 | all
let currentIndex = 0;
let filtered = [];
let answers = {};           // idx -> selected option index
let results = {};           // idx -> boolean

const tabsEl = document.getElementById("tabs");
const quizArea = document.getElementById("quizArea");
const counterEl = document.getElementById("counter");
const scoreEl = document.getElementById("score");
const progressEl = document.getElementById("progress");

function buildFiltered() {
  filtered = QUESTIONS
    .map((q, i) => ({ q, i }))
    .filter(x => mode === "all" || x.q.unit === Number(mode.replace("u", "")));
}

function buildTabActive() {
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.mode === mode);
  });
}

function currentScore() {
  let ok = 0, answered = 0;
  filtered.forEach(({ i }) => {
    if (results[i] !== undefined) { answered++; if (results[i]) ok++; }
  });
  return { ok, answered, total: filtered.length };
}

function updateStatus() {
  const { ok, answered, total } = currentScore();
  counterEl.textContent = `Pregunta ${filtered.length ? currentIndex + 1 : 0} de ${total}`;
  scoreEl.textContent = `Correctas: ${ok} / ${answered}`;
  progressEl.style.width = (answered / total * 100) + "%";
}

function render() {
  if (!filtered.length) { quizArea.innerHTML = ""; return; }
  const { q, i } = filtered[currentIndex];
  const sel = answers[i];
  const answered = sel !== undefined;

  let html = `<div class="card">`;
  html += `<div class="q-meta"><span class="q-tag">${UNIT_LABELS[q.unit]}</span><span>${currentIndex + 1} / ${filtered.length}</span></div>`;
  html += `<div class="question">${q.q}</div>`;
  html += `<div class="options">`;
  q.options.forEach((opt, oi) => {
    let cls = "option";
    if (answered) {
      if (oi === q.answer) cls += " correct";
      else if (oi === sel) cls += " incorrect";
    }
    html += `<button class="${cls}" data-oi="${oi}" ${answered ? "disabled" : ""}>`;
    html += `<span class="letter">${LETTERS[oi]}</span><span>${opt}</span></button>`;
  });
  html += `</div>`;

  if (answered) {
    const good = sel === q.answer;
    html += `<div class="feedback show ${good ? "good" : "bad"}">`;
    html += `<b>${good ? "✓ ¡Correcto!" : "✗ Incorrecto"}</b>`;
    html += `<span class="expl">${q.expl}</span>`;
    html += `</div>`;
  }

  html += `<div class="nav">`;
  html += `<button class="btn" id="prevBtn" ${currentIndex === 0 ? "disabled" : ""}>← Anterior</button>`;
  html += `<button class="btn primary" id="nextBtn">${currentIndex === filtered.length - 1 ? "Ver resultado" : "Siguiente →"}</button>`;
  html += `</div>`;
  html += `</div>`;

  quizArea.innerHTML = html;

  document.querySelectorAll(".option").forEach(btn => {
    btn.addEventListener("click", () => {
      const oi = Number(btn.dataset.oi);
      answers[i] = oi;
      results[i] = (oi === q.answer);
      render();
    });
  });

  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", next);
  const prevBtn = document.getElementById("prevBtn");
  if (prevBtn) prevBtn.addEventListener("click", () => { currentIndex--; render(); });

  updateStatus();
}

function next() {
  if (currentIndex < filtered.length - 1) { currentIndex++; render(); }
  else { renderResult(); }
}

function renderResult() {
  const { ok, answered, total } = currentScore();
  const pct = total ? Math.round(ok / total * 100) : 0;

  // per-unit breakdown
  let per = { 1: { ok: 0, n: 0 }, 2: { ok: 0, n: 0 } };
  filtered.forEach(({ i }) => {
    const u = filtered.find(x => x.i === i).q.unit;
    per[u].n++;
    if (results[i]) per[u].ok++;
  });

  let html = `<div class="card result">`;
  html += `<div class="big">${pct}%</div>`;
  html += `<p>Respondiste ${answered} de ${total} preguntas · ${ok} correctas</p>`;
  html += `<div class="per-unit">`;
  [1, 2].forEach(u => {
    if (per[u].n === 0) return;
    html += `<div class="box"><div class="n">${per[u].ok} / ${per[u].n}</div><div class="l">Unidad ${u}</div></div>`;
  });
  html += `</div>`;

  html += `<div class="nav" style="justify-content:center;">`;
  html += `<button class="btn primary" id="resetBtn">Reintentar</button>`;
  html += `<button class="btn" id="reviewBtn">Revisar respuestas</button>`;
  html += `</div>`;
  html += `</div>`;

  quizArea.innerHTML = html;
  counterEl.textContent = "Resultado";
  updateStatus();

  document.getElementById("resetBtn").addEventListener("click", resetQuiz);
  document.getElementById("reviewBtn").addEventListener("click", renderReview);
}

function renderReview() {
  let html = `<div class="card"><h2 style="margin-bottom:16px;">Revisión de respuestas</h2><div class="review-list">`;
  filtered.forEach(({ i }, idx) => {
    const q = filtered.find(x => x.i === i).q;
    const sel = answers[i];
    const ok = results[i];
    const dot = ok ? '<span class="dot ok">✓</span>' : '<span class="dot no">✗</span>';
    html += `<div class="review-item">${dot}<div><b>${idx + 1}. ${q.q}</b><br><span style="color:var(--muted)">Tu respuesta: ${sel !== undefined ? LETTERS[sel] : "—"} · Correcta: ${LETTERS[q.answer]}</span></div></div>`;
  });
  html += `</div><div class="nav" style="justify-content:center;margin-top:18px;"><button class="btn primary" id="backResultBtn">Volver al resultado</button></div></div>`;
  quizArea.innerHTML = html;
  document.getElementById("backResultBtn").addEventListener("click", renderResult);
}

function resetQuiz() {
  answers = {};
  results = {};
  currentIndex = 0;
  render();
}

tabsEl.addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  mode = tab.dataset.mode;
  answers = {};
  results = {};
  currentIndex = 0;
  buildFiltered();
  buildTabActive();
  render();
});

// init
buildFiltered();
buildTabActive();
render();
</script>

</html>
